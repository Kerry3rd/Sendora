services:
  - type: web
    name: sendora-backend
    env: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: sendora-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sendora-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sendora-frontend.vercel.app

  - type: redis
    name: sendora-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: sendora-db
    plan: free